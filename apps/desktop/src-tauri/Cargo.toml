[package]
name = "pdf-e-rechnung"
version = "0.1.0"
description = "PDF E-Rechnung desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "pdf_e_rechnung_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
