name: Build API sidecars

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-14
            target: aarch64-apple-darwin
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Compile API sidecar
        run: node scripts/build-tauri-sidecar.mjs
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: einvoice-api-${{ matrix.target }}
          path: apps/desktop/src-tauri/binaries/einvoice-api-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error
